# Netlify deployment — static Astro site + one serverless function
# (/api/tournaments) backed by Netlify Blobs for permanent, shared storage.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Astro 7 / package.json engines require Node >= 22.12.
  NODE_VERSION = "22"

[functions]
  # Modern Request/Response functions, bundled with esbuild.
  node_bundler = "esbuild"

# Local function testing: `npm run build` then `npx netlify dev` serves dist/ +
# the /api function + a local Blobs sandbox. (`npm run dev` alone runs the UI
# with the tournaments backend unavailable, i.e. local-run-only mode.)
[dev]
  framework = "#static"
  publish = "dist"

# Content-hashed assets never change — cache them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA-style fallback for unknown paths. Static files and the /api/* function are
# matched first, so this only catches typos / deep links and keeps the app usable.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
